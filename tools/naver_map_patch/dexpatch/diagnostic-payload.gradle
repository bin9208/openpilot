tasks.named("compilePayloadJava", JavaCompile) {
  dependsOn("verifyDiagnosticPayloadSources", "generateDiagnosticConfig")
  options.release = 8
  doFirst {
    def payload = readDiagnosticProfile()
    def androidHome = System.getenv("ANDROID_HOME")
    if (androidHome == null || androidHome.isBlank()) {
      throw new GradleException("ANDROID_HOME is required for diagnostic payload")
    }
    def androidJar = file(
        "${androidHome}/platforms/android-${payload.android_platform_api}/android.jar")
    if (!androidJar.isFile()) {
      throw new GradleException("Android platform API 36 is unavailable")
    }
    classpath = files(androidJar)
  }
}

tasks.register("diagnosticPayloadJar", Jar) {
  dependsOn("compilePayloadJava")
  archiveFileName = "diagnostic-payload.jar"
  destinationDirectory = diagnosticPayloadDirectory
  from(sourceSets.payload.output)
}

tasks.register("payloadDex", Exec) {
  dependsOn("diagnosticPayloadJar")
  inputs.file(tasks.named("diagnosticPayloadJar", Jar).flatMap { it.archiveFile })
  outputs.file(diagnosticPayloadDirectory.map { it.file("classes43.dex") })
  doFirst {
    requireDiagnosticMode()
    def payload = readDiagnosticProfile()
    def androidHome = System.getenv("ANDROID_HOME")
    if (androidHome == null || androidHome.isBlank()) {
      throw new GradleException("ANDROID_HOME is required for D8")
    }
    def executableName = System.getProperty("os.name")
        .toLowerCase().contains("windows") ? "d8.bat" : "d8"
    def d8 = file(
        "${androidHome}/build-tools/${payload.build_tools_version}/${executableName}")
    if (!d8.isFile()) {
      throw new GradleException("configured Android D8 is unavailable")
    }
    delete(diagnosticDexDirectory)
    diagnosticDexDirectory.get().asFile.mkdirs()
    commandLine(
        d8.absolutePath,
        "--min-api", "26",
        "--output", diagnosticDexDirectory.get().asFile.absolutePath,
        tasks.named("diagnosticPayloadJar", Jar).get()
            .archiveFile.get().asFile.absolutePath)
  }
  doLast {
    def classesDex = diagnosticDexDirectory.get().file("classes.dex").asFile
    if (!classesDex.isFile()) {
      throw new GradleException("D8 did not produce classes.dex")
    }
    copy {
      from(classesDex)
      into(diagnosticPayloadDirectory)
      rename { "classes43.dex" }
    }
  }
}

tasks.register("diagnosticPatch", JavaExec) {
  dependsOn("payloadDex")
  classpath = sourceSets.main.runtimeClasspath
  mainClass = "ai.comma.naver.dexpatch.DexPatchMain"
  doFirst {
    requireDiagnosticMode()
    def apk = providers.gradleProperty("apk").orNull
    def output = providers.gradleProperty("output").orNull
    if (apk == null || output == null) {
      throw new GradleException("diagnosticPatch requires -Papk and -Poutput")
    }
    def profile = readFullDiagnosticProfile()
    def payload = profile.diagnostic_payload
    def encodedRules = [
        *encodeDiagnosticPatchRules(profile),
        encodeInfrastructurePatchRule(profile),
    ]
    args = [
        "patch", apk, output,
        diagnosticPayloadDirectory.get().file("classes43.dex").asFile.absolutePath,
        payload.payload_dex_entry, selectedHookDescriptor(profile),
        *encodedRules,
    ]
  }
}

tasks.named("test") {
  dependsOn("compilePayloadJava", "payloadDex")
  systemProperty(
      "naver.diagnostic.payloadDex",
      diagnosticPayloadDirectory.get().file("classes43.dex").asFile.absolutePath)
  systemProperty("naver.fieldAcceptance", fieldAcceptance.toString())
  if (fieldAcceptance) {
    systemProperty(
        "naver.fieldAcceptance.payloadDex",
        diagnosticPayloadDirectory.get().file("classes43.dex").asFile.absolutePath)
  }
}
