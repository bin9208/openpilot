def readFullDiagnosticProfile = {
  return new JsonSlurper().parse(diagnosticProfileFile)
}
def readDiagnosticProfile = {
  def profile = readFullDiagnosticProfile()
  if (profile.diagnostic_payload == null) {
    throw new GradleException("profile has no diagnostic_payload")
  }
  return profile.diagnostic_payload
}
def selectedHookDescriptor = { fullProfile ->
  return fieldAcceptance
      ? fieldAcceptanceHookDescriptor
      : fullProfile.diagnostic_payload.hook_class_descriptor
}
def encodeDiagnosticPatchRules = { fullProfile ->
  def payload = fullProfile.diagnostic_payload
  def anchors = fullProfile.anchors
  if (!(anchors instanceof List) || anchors.size() != 7
      || anchors.any { anchor -> !(anchor instanceof Map) || anchor.diagnostic_hook == null
          || !(anchor.instruction_window instanceof List) }) {
    throw new GradleException("diagnostic profile must define exactly seven hook anchors")
  }
  def encoder = java.util.Base64.getUrlEncoder().withoutPadding()
  def encode = { anchor ->
    def hook = anchor.diagnostic_hook
    def fields = [anchor.name, anchor.dex_entry, anchor.class_descriptor, anchor.method_descriptor,
        anchor.instruction_window.size().toString(), *anchor.instruction_window,
        selectedHookDescriptor(fullProfile), hook.method_descriptor, hook.placement.kind,
        hook.placement.index.toString(), hook.argument.kind, hook.argument.index.toString()]
    encoder.encodeToString(fields.join(Character.toString(0x1f)).getBytes("UTF-8"))
  }
  return anchors.collect(encode)
}
def encodeInfrastructurePatchRule = { fullProfile ->
  def sharing = fullProfile.diagnostic_payload.capture_sharing
  def anchor = sharing.infrastructure_anchor
  def hook = anchor.diagnostic_hook
  def fields = [anchor.name, anchor.dex_entry, anchor.class_descriptor, anchor.method_descriptor,
      anchor.instruction_window.size().toString(), *anchor.instruction_window,
      selectedHookDescriptor(fullProfile), hook.method_descriptor,
      hook.placement.kind, hook.placement.index.toString(), hook.argument.kind,
      hook.argument.index.toString()]
  return java.util.Base64.getUrlEncoder().withoutPadding()
      .encodeToString(fields.join(Character.toString(0x1f)).getBytes("UTF-8"))
}

def requireDiagnosticMode = {
  def mode = providers.gradleProperty("payloadMode").orElse("diagnostic").get()
  if (mode != "diagnostic") {
    throw new GradleException(
        "diagnostic payload tasks require -PpayloadMode=diagnostic")
  }
}

sourceSets {
  payload {
    if (fieldAcceptance) {
      java.srcDirs(
          "src/payload/java", fieldAcceptanceSourceDirectory, productionSourceDirectory)
      java.exclude(
          "**/DiagnosticHooks.java",
          "**/DiagnosticSampler.java",
          "**/ProductionHooks.java")
    } else {
      java.srcDir("src/payload/java")
    }
    java.srcDir(diagnosticGeneratedRoot)
  }
  test {
    java.srcDir(diagnosticTestGeneratedRoot)
    if (fieldAcceptance) {
      java.exclude(
          "**/DiagnosticConfigBehaviorTest.java",
          "**/DiagnosticPayloadDexTest.java",
          "**/DexDiagnosticPatchIntegrationTest.java",
          "**/ProductionHooksTest.java",
          "**/ProductionPayloadCompositionTest.java")
    } else {
      java.exclude(
          "**/FieldAcceptance*.java",
          "**/Naver6805ObjectMapperTest.java",
          "**/NaverNavigationAggregatorTest.java",
          "**/NaverNavigationEnvelopeTest.java",
          "**/NaverNavigationSenderTest.java",
          "**/BumpWireFixture.java",
          "**/ProductionHooksTest.java",
          "**/ProductionPayloadCompositionTest.java")
    }
    compileClasspath += sourceSets.payload.output
    runtimeClasspath += sourceSets.payload.output
  }
}

tasks.register("verifyDiagnosticPayloadSources") {
  inputs.dir("src/payload/java")
  if (fieldAcceptance) {
    inputs.dir(fieldAcceptanceSourceDirectory)
    inputs.dir(productionSourceDirectory)
  }
  doLast {
    requireDiagnosticMode()
    def diagnosticSources = fileTree("src/payload/java") {
      include("**/*.java")
    }.files
    def diagnosticNames = diagnosticSources.collect { it.name } as Set
    if (diagnosticNames != diagnosticSourceNames) {
      throw new GradleException(
          "diagnostic payload source allowlist mismatch: " + diagnosticNames)
    }
    diagnosticSources.each { source ->
      def text = source.getText("UTF-8")
      forbiddenDiagnosticSourceTokens.each { token ->
        if (text.contains(token)) {
          throw new GradleException(
              "forbidden diagnostic payload reference in ${source.name}: ${token}")
        }
      }
    }
    if (fieldAcceptance) {
      def fieldNames = fileTree(fieldAcceptanceSourceDirectory) {
        include("**/*.java")
      }.files.collect { it.name } as Set
      def productionNames = fileTree(productionSourceDirectory) {
        include("**/*.java")
      }.files.collect { it.name } as Set
      if (fieldNames != fieldAcceptanceSourceNames) {
        throw new GradleException(
            "field acceptance source allowlist mismatch: " + fieldNames)
      }
      if (productionNames != productionFamilySourceNames) {
        throw new GradleException(
            "field production family source allowlist mismatch: " + productionNames)
      }
    }
  }
}

tasks.register("generateDiagnosticConfig") {
