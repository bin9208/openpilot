        ],
    ]
    if (payload.main_process != "com.nhn.android.nmap"
        || payload.min_api != 26
        || payload.android_platform_api != 36
        || payload.receiver_host != "127.0.0.1"
        || payload.receiver_port != 7712
        || payload.socket_timeout_ms != 100
