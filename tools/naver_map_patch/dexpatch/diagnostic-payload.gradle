  static final String CAPTURE_FILE_PROVIDER_ROOT_NAME = "${captureSharing.file_provider_root_name}";
  static final String CAPTURE_GRANTEE_PACKAGE = "${captureSharing.grantee_package}";
  static final int CAPTURE_QUIESCE_TIMEOUT_MS = ${captureSharing.quiesce_timeout_ms};
  static final String OFFLINE_CAPTURE_EXPORT_DATABASE_NAME = "${captureSharing.export_database_name}";
  static final int OFFLINE_CAPTURE_BATCH_SIZE = ${offlineCapture.batch_size};
  static final String OFFLINE_CAPTURE_DATABASE_NAME = "${offlineCapture.database_name}";
  static final String OFFLINE_CAPTURE_DATABASE_RECOVERY_NAME = "${offlineCapture.database_recovery_name}";
