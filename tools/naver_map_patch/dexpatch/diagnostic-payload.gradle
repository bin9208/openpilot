  private static final String ENCODED_INFRASTRUCTURE_PATCH_RULE =
      "${encodedInfrastructureRule}";

  public static String[] encodedNavigationPatchRules() {
    return ENCODED_NAVIGATION_PATCH_RULES.clone();
  }

