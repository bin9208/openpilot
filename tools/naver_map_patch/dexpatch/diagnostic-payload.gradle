    }.join(", ") }
    def allowlistConstants = payload.accessor_allowlists.collect { channel, values ->
      "  static final String[] ${channel.toUpperCase()}_ACCESSOR_ALLOWLIST = new String[] {${accessorArray(values)}};"
    }.join("\n")
    def allowlistSelection = payload.accessor_allowlists.keySet().collect { channel ->
