  outputs.dirs(diagnosticGeneratedRoot, diagnosticTestGeneratedRoot)
  doLast {
    requireDiagnosticMode()
    def payload = readDiagnosticProfile()
    def fullProfile = readFullDiagnosticProfile()
    def anchors = fullProfile.anchors
    def offlineCapture = payload.offline_capture
    def captureSharing = payload.capture_sharing
    def expectedOfflineCapture = [
        batch_size: 32,
        channel_quotas: [
            lane: 1536,
            route: 256,
            safety: 6144,
            status: 256,
            tbt_current: 1536,
            tbt_next: 1536,
        ],
        database_name: "capture-v3.sqlite3",
        database_recovery_name: "capture-v3-recovery.sqlite3",
        directory_name: "naver-diagnostic",
        flush_interval_ms: 250,
        journal_size_limit_bytes: 4194304,
        local_queue_capacity: 256,
        max_database_bytes: 67108864,
        network_queue_capacity: 64,
        payload_build_id: "naver-6.8.0.5-diagnostic-offline-v3",
        pinned_per_channel: 64,
        retry_initial_ms: 1000,
        retry_max_ms: 30000,
        schema_version: 1,
        wal_autocheckpoint_pages: 256,
    ]
    def expectedCaptureSharing = [
        authority: "com.nhn.android.nmap.fileprovider",
        external_files_root_path: "NaverNavi",
        export_database_name: "capture-v3-export.sqlite3",
        file_provider_root_name: "navi_trace",
        grantee_package: "com.android.shell",
        quiesce_timeout_ms: 5000,
        infrastructure_anchor: [
            name: "capture_export_quiesce",
            dex_entry: "classes.dex",
            class_descriptor: "Landroidx/core/content/FileProvider;",
            method_descriptor:
                "openFile(Landroid/net/Uri;Ljava/lang/String;)Landroid/os/ParcelFileDescriptor;",
            instruction_window: [
                "invoke-virtual Landroidx/core/content/FileProvider;->f()Landroidx/core/content/FileProvider\$PathStrategy;",
                "move-result-object",
                "invoke-interface Landroidx/core/content/FileProvider\$PathStrategy;->b(Landroid/net/Uri;)Ljava/io/File;",
            ],
            expected_count: 1,
            diagnostic_hook: [
                argument: [index: 0, kind: "parameter"],
                method_descriptor: "beforeCaptureRead(Ljava/lang/Object;)V",
