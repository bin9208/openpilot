""", "UTF-8")
    def encodedNavigationRules = encodeDiagnosticPatchRules(fullProfile)
    def encodedInfrastructureRule = encodeInfrastructurePatchRule(fullProfile)
    def dexpatchDirectory = diagnosticTestGeneratedRoot.get()
        .dir("ai/comma/naver/dexpatch").asFile
    dexpatchDirectory.mkdirs()
    def encodedNavigationRuleLiterals =
        encodedNavigationRules.collect { '    "' + it + '"' }.join(",\n")
    new File(dexpatchDirectory, "DiagnosticProfileContract.java").setText(
        """package ai.comma.naver.dexpatch;

/** Generated only from the selected diagnostic profile; used by integration tests. */
public final class DiagnosticProfileContract {
  public static final String PROFILE_ID = "${fullProfile.profile_id}";
  public static final String HOOK_CLASS_DESCRIPTOR = "${selectedHookDescriptor(fullProfile)}";
  public static final String PAYLOAD_BUILD_ID = "${generatedBuildId}";
  private static final String[] ENCODED_NAVIGATION_PATCH_RULES = new String[] {
${encodedNavigationRuleLiterals}
