def fieldAcceptanceSourceDirectory = file("src/fieldAcceptance/java")
def productionSourceDirectory = file("../payload/src/main/java")
def fieldAcceptanceHookDescriptor =
    "Lai/comma/naver/payload/FieldAcceptanceHooks;"
def fieldAcceptanceBuildId = "naver-6.8.0.5-field-acceptance-v4"
def diagnosticSourceNames = [
    "AndroidApplicationFiles.java",
    "AndroidCaptureSharing.java",
    "AndroidProcess.java",
    "AndroidSQLiteCaptureDatabase.java",
    "AsyncDiagnosticSink.java",
    "BoundedMappingDiagnostics.java",
    "CaptureDatabase.java",
    "CaptureRetentionPolicy.java",
    "DiagnosticCounters.java",
    "DiagnosticFrameSink.java",
    "DiagnosticHooks.java",
    "DiagnosticRuntime.java",
    "DiagnosticSampler.java",
    "EncodedDiagnosticFrame.java",
    "FrameBatchConsumer.java",
    "HookRuntime.java",
    "NavigationTransport.java",
    "NetworkFrameConsumer.java",
    "OfflineCaptureStore.java",
    "PersistentNavigationTransport.java",
] as Set
def fieldAcceptanceSourceNames = [
    "FieldAcceptanceDiagnosticSampler.java",
    "FieldAcceptanceHooks.java",
] as Set
def productionFamilySourceNames = [
    "Naver6805ObjectMapper.java",
    "NaverNavigationAggregator.java",
    "NaverNavigationEnvelope.java",
    "NaverNavigationSender.java",
    "NaverNavigationState.java",
    "ProductionHooks.java",
