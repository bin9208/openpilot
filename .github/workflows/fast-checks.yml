name: Fast checks
on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.2
      - name: Check changed Python syntax and whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/check_changed_files.py
      - name: Check CI routing and upstream synchronization guards
        run: |
          python -m unittest discover -s tools/ci/tests -v
          python -m unittest discover -s tools/naver_ci/tests -v
      - name: Fast navigation regressions
        run: |
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests -q \
            openpilot/selfdrive/carrot/tests/test_naver_input_smoke.py \
            openpilot/selfdrive/carrot/tests/test_naver_navigation_protocol.py \
            openpilot/selfdrive/carrot/tests/test_navigation_sources.py
      - name: Jetlink package and protocol regressions
        run: |
          python -m pip install -r tools/jetlink_model/requirements.lock
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink_model/tests -q tools/jetlink_model/tests
          python -m pytest -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/modeld/tests -q openpilot/selfdrive/modeld/tests/test_jetlink*.py
          bash -n openpilot/selfdrive/modeld/jetlink/setup_gadget.sh
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Android Jetlink core regressions
        run: bash tools/jetlink_android/gradlew -p tools/jetlink_android :core:test :runtime:test
